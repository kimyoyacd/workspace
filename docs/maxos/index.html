<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>MAX OS — 홈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/shell.css" />
  <style>
    /* ── 홈 — 고를 게 셋뿐. 하나를 고르기 전에는 아래가 열리지 않는다 ── */
    .hero {
      border-radius: 27px; background: var(--card); border: 1px solid var(--line);
      padding: 34px 40px 34px; position: relative; overflow: hidden;
    }
    .eyebrow { font: 600 10px/1.2 var(--mono); letter-spacing: 0.18em; color: #777; margin-bottom: 16px; }
    .hello { font-size: 15px; color: #686868; margin: 0 0 14px; }
    .hero h1 { font-size: clamp(26px, 3vw, 40px); line-height: 1.16; letter-spacing: -0.055em; margin: 0; font-weight: 740; }
    .hero p { font-size: 15px; color: #686868; margin: 16px 0 0; max-width: 660px; }
    .hero-meta { margin-top: 22px; font: 500 10.5px/1.5 var(--mono); color: #8e8e8e; letter-spacing: 0.08em; }
    .hero-accent {
      position: absolute; width: 300px; height: 300px; border-radius: 50%; right: -140px; bottom: -190px;
      background: radial-gradient(circle at 20% 25%, rgba(255,107,61,.4), rgba(139,124,246,.2) 45%, rgba(175,197,247,.02) 70%);
      filter: blur(7px); pointer-events: none;
    }

    .pick-label { margin: 26px 2px 12px; font-size: 13px; font-weight: 700; color: #6b6b66; }
    .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .pick {
      position: relative; text-align: left; cursor: pointer;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px 22px 18px; min-height: 172px;
      display: flex; flex-direction: column;
    }
    .pick:hover { border-color: #cfcfca; }
    .pick.on { border-color: var(--black); box-shadow: 0 0 0 1px var(--black); }
    .pick-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .pick-no { font: 600 10px var(--mono); color: #8c8c8c; letter-spacing: 0.12em; }
    .pick-pm {
      flex: none; width: 30px; height: 30px; border-radius: 50%;
      border: 1.5px solid #cfcfca; background: #fff;
      display: grid; place-items: center; font-size: 17px; line-height: 1; color: var(--black);
    }
    .pick.on .pick-pm { background: var(--black); border-color: var(--black); color: #fff; }
    .pick b { display: block; font-size: 19px; letter-spacing: -0.04em; margin: 22px 0 8px; font-weight: 740; }
    .pick span { font-size: 12.5px; color: #777; line-height: 1.55; }
    .pick .pick-hint { margin-top: auto; padding-top: 12px; font-size: 11.5px; font-weight: 700; color: #8c8c86; }
    .pick.on .pick-hint { color: var(--black); }
    .pick .rule { position: absolute; left: 22px; right: 22px; bottom: 0; height: 4px; border-radius: 4px 4px 0 0; opacity: .9; }
    .g1 { background: linear-gradient(90deg, var(--orange), var(--lavender)); }
    .g2 { background: linear-gradient(90deg, var(--lavender), var(--blue)); }
    .g3 { background: linear-gradient(90deg, var(--yellow), var(--orange), var(--lavender)); }

    /* ── 고른 뒤에만 열리는 자리 ── */
    #drawer[hidden] { display: none; }
    .drawer {
      margin-top: 18px; background: var(--card); border: 1px solid var(--black);
      border-radius: var(--radius); padding: 24px 26px 22px;
    }
    .dr-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .dr-head h2 { font-size: 20px; letter-spacing: -0.04em; margin: 0; }
    .dr-close { background: none; border: 0; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--muted2); padding: 4px; }
    .dr-close:hover { color: var(--black); }
    .dr-desc { font-size: 13px; color: var(--muted); margin: 6px 0 18px; max-width: 640px; }

    /* 손이 필요한 일 — 한 줄 = 한 상황 */
    .need { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .need a, .need .off {
      background: var(--card); text-decoration: none; color: inherit;
      display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: 14px;
      padding: 15px 18px; min-height: 62px;
    }
    .need a:hover { background: #fcfcfa; }
    .need .off .what { color: #9a9a94; }
    .need .off .what small { color: #a8a8a2; }
    .need .n { font-size: 26px; font-weight: 750; letter-spacing: -0.05em; }
    .need .n.zero { color: #b6b6b0; }
    .need .what { font-size: 14px; font-weight: 650; }
    .need .what small { display: block; font-weight: 500; font-size: 12px; color: #7d7d77; margin-top: 3px; }
    .need .go { font-size: 12px; font-weight: 700; color: #8c8c86; white-space: nowrap; }
    .need a:hover .go { color: var(--black); }

    /* 갈래 고르기 */
    .brs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .br {
      display: block; text-decoration: none; color: inherit;
      border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; background: var(--panel);
    }
    .br:hover { border-color: #cfcfca; background: var(--card); }
    .br b { display: block; font-size: 15px; letter-spacing: -0.03em; }
    .br span { display: block; font-size: 12px; color: #777; margin-top: 6px; line-height: 1.5; }
    .br i { display: block; font-style: normal; font-size: 11.5px; font-weight: 700; color: #8c8c86; margin-top: 10px; }
    .br:hover i { color: var(--black); }

    .steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .st3 { border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; background: var(--panel); text-decoration: none; color: inherit; display: block; }
    .st3:hover { border-color: #cfcfca; background: var(--card); }
    .st3 em { font-style: normal; font: 600 10px var(--mono); color: #8c8c8c; letter-spacing: 0.12em; }
    .st3 b { display: block; font-size: 15px; letter-spacing: -0.03em; margin: 10px 0 6px; }
    .st3 span { font-size: 12px; color: #777; line-height: 1.5; }

    .dr-foot { margin-top: 16px; font-size: 12px; color: var(--muted2); }
    .dr-foot a { font-weight: 700; color: var(--black); text-decoration: none; }
    .dr-foot a:hover { text-decoration: underline; }

    .home-foot { margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

    @media (max-width: 1023px) {
      .picks { grid-template-columns: 1fr; }
      .pick { min-height: 0; }
      .brs, .steps3 { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .hero { padding: 24px 22px; }
      .need a, .need .off { grid-template-columns: 56px 1fr; }
      .need .go { display: none; }
    }
  </style>
</head>
<body data-page="home">
  <div class="app">
    <main class="main">

      <section class="hero">
        <div class="eyebrow">MAX OS · HOME</div>
        <p class="hello">안녕하세요, 김효정님</p>
        <h1>일이 들어오면,<br />여기서 시작해요</h1>
        <p>MAX OS는 MAX실이 일하는 순서를 그대로 옮겨 둔 곳입니다. 요청을 받는 순간부터 만들고, 확인받고, 다시 쓸 수 있게 모으는 데까지 이어집니다.</p>
        <div class="hero-meta" id="hero-meta">오늘 날짜 확인 중…</div>
        <div class="hero-accent"></div>
      </section>

      <div class="pick-label">오늘은 어느 쪽인가요? 하나를 누르면 아래가 열립니다.</div>
      <div class="picks" role="group" aria-label="오늘의 선택">
        <button class="pick" type="button" data-pick="new" aria-expanded="false" aria-controls="drawer">
          <div class="pick-top"><span class="pick-no">01 · NEW</span><span class="pick-pm" aria-hidden="true">＋</span></div>
          <b>새 일 시작하기</b>
          <span>방금 들어온 요청을 어떤 순서로 만들지 알려드립니다.</span>
          <span class="pick-hint">＋ 를 누르면 갈래가 열립니다</span>
          <div class="rule g1"></div>
        </button>
        <button class="pick" type="button" data-pick="continue" aria-expanded="false" aria-controls="drawer">
          <div class="pick-top"><span class="pick-no">02 · TODAY</span><span class="pick-pm" aria-hidden="true">＋</span></div>
          <b>하던 일 이어서 하기</b>
          <span>지금 돌아가는 일 중에 손이 필요한 곳을 짚어 드립니다.</span>
          <span class="pick-hint">＋ 를 누르면 목록이 열립니다</span>
          <div class="rule g3"></div>
        </button>
        <button class="pick" type="button" data-pick="first" aria-expanded="false" aria-controls="drawer">
          <div class="pick-top"><span class="pick-no">03 · FIRST</span><span class="pick-pm" aria-hidden="true">＋</span></div>
          <b>처음이라 둘러보기</b>
          <span>MAX실이 일하는 방식을 5분 만에 훑어봅니다.</span>
          <span class="pick-hint">＋ 를 누르면 순서가 열립니다</span>
          <div class="rule g2"></div>
        </button>
      </div>

      <section id="drawer" class="drawer" hidden aria-live="polite"></section>

      <div class="home-foot">
        <span class="src-badge" id="home-src"><span class="sdot"></span>데이터 확인 중…</span>
        <span class="mono" style="color:var(--muted2);font-size:10.5px">이 정보가 연결된 곳: Notion 프로젝트 DB · 시간 기록 시트</span>
      </div>

    </main>
  </div>

  <script src="assets/shell.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/flows.js"></script>
  <script>
    (function () {
      var drawer = document.getElementById('drawer');
      var picks = Array.prototype.slice.call(document.querySelectorAll('.pick'));
      var NEED = null;   /* 데이터가 오면 채워진다 */

      var d = new Date();
      var yoil = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
      var dateText = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0') + ' · ' + yoil + '요일';
      document.getElementById('hero-meta').textContent = dateText;

      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

      /* ── 01 새 일 시작하기 — 갈래는 워크플로우 데이터에서 그대로 가져온다 ── */
      function viewNew() {
        var brs = (window.FLOWS && FLOWS.branches ? FLOWS.branches : []).map(function (b) {
          var n = b.subtypes.length;
          return '<a class="br" href="workflows.html#' + b.id + '">' +
            '<b>' + esc(b.label) + '</b>' +
            '<span>' + esc(b.when) + '</span>' +
            '<i>' + (n > 1 ? n + '가지 중에 고르고 순서 보기 →' : '순서 보기 →') + '</i>' +
            '</a>';
        }).join('');
        return {
          title: '무엇을 만드시나요?',
          desc: '만들 결과물만 고르시면 됩니다. 고르면 1~3단계가 순서대로 열립니다. 맡은 사람이 끝까지 이어서 하고, 디렉터는 방향만 봅니다.',
          body: '<div class="brs">' + brs + '</div>',
          foot: '<a href="workflows.html">전체 지도 한 번에 보기 →</a>'
        };
      }

      /* ── 02 하던 일 이어서 하기 — 숫자는 여기 세 줄만. 나머지는 운영 현황에 ── */
      function viewContinue() {
        var rows;
        if (!NEED) {
          rows = '<a href="operations.html#projects"><span class="n">…</span>' +
            '<span class="what">불러오는 중이에요<small>잠시만 기다려 주세요</small></span>' +
            '<span class="go">진행 중인 일 보기 →</span></a>';
        } else if (NEED.err) {
          rows = '<a href="operations.html#projects"><span class="n zero">—</span>' +
            '<span class="what">최신 정보를 불러오지 못했어요<small>노션 연동이 멈췄을 수 있어요. 운영 현황에서 마지막 정상 데이터를 확인해 주세요.</small></span>' +
            '<span class="go">운영 현황 열기 →</span></a>';
        } else {
          var defs = [
            { n: NEED.delayed, what: '마감일이 지났어요', how: '일정을 다시 잡거나 마감일을 고쳐 주세요', href: 'operations.html#projects&late=1' },
            { n: NEED.dueSoon, what: '7일 안에 마감이에요', how: '남은 단계를 확인해 주세요', href: 'operations.html#projects&due=7' },
            { n: NEED.conflict, what: '시작일이 마감일보다 늦어요', how: '노션에서 날짜를 고쳐 주세요', href: 'operations.html#projects&conflict=1' }
          ];
          rows = defs.map(function (r) {
            /* 0건이면 열어도 빈 화면이라 누르지 못하게 둔다 */
            var open = r.n > 0;
            return (open ? '<a href="' + r.href + '">' : '<div class="off">') +
              '<span class="n' + (open ? '' : ' zero') + '">' + r.n + '건</span>' +
              '<span class="what">' + esc(r.what) + '<small>' + esc(open ? r.how : '지금은 손댈 곳이 없어요') + '</small></span>' +
              '<span class="go">' + (open ? '이 일들만 보기 →' : '') + '</span>' +
              (open ? '</a>' : '</div>');
          }).join('');
        }
        return {
          title: '지금 손이 필요한 일',
          desc: '한 줄을 누르면 운영 현황에서 그 일들만 열립니다. 진행 건수·가동률 같은 숫자는 운영 현황 한 곳에 모아 뒀습니다.',
          body: '<div class="need">' + rows + '</div>',
          foot: '<a href="operations.html#projects">지금 돌아가는 일 전체 보기 →</a>'
        };
      }

      /* ── 03 처음이라 둘러보기 ── */
      function viewFirst() {
        return {
          title: '5분이면 됩니다',
          desc: '순서대로 보시면 됩니다. 다 읽지 않으셔도 되고, 첫 일을 맡으실 때 다시 오시면 됩니다.',
          body: '<div class="steps3">' +
            '<a class="st3" href="onboarding.html"><em>STEP 01</em><b>우리가 어떻게 일하는지</b><span>팀 문화와 일하는 순서를 한 장으로 봅니다.</span></a>' +
            '<a class="st3" href="workflows.html"><em>STEP 02</em><b>일이 어떤 순서로 흘러가는지</b><span>요청이 들어와서 자산으로 남을 때까지의 지도입니다.</span></a>' +
            '<a class="st3" href="ai-runtime.html"><em>STEP 03</em><b>AI를 어떻게 쓰는지</b><span>Claude Code를 처음 켜는 데까지 따라 하시면 됩니다.</span></a>' +
            '</div>',
          foot: '<a href="roles.html">우리가 일하는 기준 보기 →</a>'
        };
      }

      var VIEWS = { 'new': viewNew, 'continue': viewContinue, 'first': viewFirst };
      var current = '';

      function paint() {
        picks.forEach(function (b) {
          var on = b.getAttribute('data-pick') === current;
          b.classList.toggle('on', on);
          b.setAttribute('aria-expanded', on ? 'true' : 'false');
          b.querySelector('.pick-pm').textContent = on ? '−' : '＋';
          b.querySelector('.pick-hint').textContent = on ? '아래에 열려 있어요 · 다시 누르면 접혀요' :
            (b.getAttribute('data-pick') === 'new' ? '＋ 를 누르면 갈래가 열립니다'
              : b.getAttribute('data-pick') === 'continue' ? '＋ 를 누르면 목록이 열립니다'
              : '＋ 를 누르면 순서가 열립니다');
        });

        if (!current || !VIEWS[current]) { drawer.hidden = true; drawer.innerHTML = ''; return; }
        var v = VIEWS[current]();
        drawer.hidden = false;
        drawer.innerHTML =
          '<div class="dr-head"><h2>' + esc(v.title) + '</h2>' +
          '<button class="dr-close" type="button" id="dr-close">접기 ✕</button></div>' +
          '<p class="dr-desc">' + esc(v.desc) + '</p>' +
          v.body +
          (v.foot ? '<div class="dr-foot">' + v.foot + '</div>' : '');
        document.getElementById('dr-close').addEventListener('click', function () { go(''); });
      }

      function go(key) {
        current = key;
        var want = key ? '#' + key : '';
        if ((location.hash || '') !== want) {
          if (want) location.hash = want;
          else history.replaceState(null, '', location.pathname + location.search);
        }
        paint();
      }

      picks.forEach(function (b) {
        b.addEventListener('click', function () {
          var k = b.getAttribute('data-pick');
          go(current === k ? '' : k);
        });
      });

      window.addEventListener('hashchange', function () {
        var k = (location.hash || '').slice(1);
        current = VIEWS[k] ? k : '';
        paint();
      });

      /* 첫 진입: 링크로 들어온 경우만 열어 둔다 */
      var initial = (location.hash || '').slice(1);
      current = VIEWS[initial] ? initial : '';
      paint();

      MAXOS.fetchData().then(function (data) {
        var src = document.getElementById('home-src');
        if (!data) {
          NEED = { err: true };
          src.className = 'src-badge err';
          src.innerHTML = '<span class="sdot"></span>최신 정보를 불러오지 못했어요';
          shellSetSync('err', '데이터 연결 안 됨');
          if (current === 'continue') paint();
          return;
        }
        var ps = MAXOS.normalizeProjects(data);
        NEED = {
          delayed: ps.filter(function (p) { return p.delayed; }).length,
          dueSoon: ps.filter(function (p) { return p.dueSoon; }).length,
          conflict: ps.filter(function (p) { return p.dateConflict; }).length
        };
        var f = MAXOS.freshness(data);
        src.className = 'src-badge' + (f.state === 'ok' ? '' : f.state === 'stale' ? ' stale' : ' err');
        src.innerHTML = '<span class="sdot"></span>' + f.text;
        shellSetSync(f.state, f.state === 'ok' ? '시스템 정상 연결' : f.text);
        document.getElementById('hero-meta').textContent = dateText + '　/　' + f.text;
        if (current === 'continue') paint();
      });
    })();
  </script>
</body>
</html>
