<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>MAX OS — 일의 흐름</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/shell.css" />
<style>
/* ── 진입·종료 스파인 ── */
.spine{display:grid;grid-template-columns:repeat(4,1fr);gap:0;align-items:stretch}
.spine.end3{grid-template-columns:repeat(3,1fr)}
.snode{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px 16px;position:relative}
.snode b{display:block;font-size:13.5px;letter-spacing:-.03em;margin-bottom:5px}
.snode .en{font:500 10px var(--mono);color:var(--muted2);font-weight:400}
.snode span.n{font-size:11.5px;color:var(--muted);line-height:1.55;display:block}
.spine .snode:not(:last-child){margin-right:26px}
.spine .snode:not(:last-child)::after{content:'→';position:absolute;right:-20px;top:50%;transform:translateY(-50%);color:#c9c7c0;font-size:14px}
.spine-label{font:600 9.5px var(--mono);letter-spacing:.16em;color:var(--muted2);text-transform:uppercase;margin:0 2px 10px}

/* ── 갈래 ── */
.branches{margin:22px 0;padding:22px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.branch{border:1.5px solid var(--line);border-radius:18px;background:var(--card);padding:0;margin-bottom:10px;overflow:hidden;transition:opacity .15s}
.branch:last-child{margin-bottom:0}
.branch.dim{opacity:.42}
.branch.open{border-color:var(--black)}
.b-head{width:100%;text-align:left;border:0;background:transparent;padding:16px 18px;cursor:pointer;display:block}
.b-head:hover{background:#fcfcfa}
.b-head:hover .pm{border-color:var(--black);background:var(--black);color:#fff}
.pm{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #cfcfca;background:#fff;
    display:grid;place-items:center;font-size:17px;font-weight:400;line-height:1;color:#555;transition:.12s}
.branch.open .pm{background:var(--black);border-color:var(--black);color:#fff}
.b-hint{font-size:11.5px;color:var(--muted2);margin-top:9px}
.stype{position:relative;padding-right:34px}
.stype::after{content:'→';position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#b5b2ab;font-size:13px}
.stype:hover::after{color:var(--black)}
.stype.on::after{content:'✓';color:#fff}
.b-top{display:flex;align-items:baseline;gap:10px}
.b-top b{font-size:16px;letter-spacing:-.035em}
.b-top .cnt{margin-left:auto;font:600 10.5px var(--mono);color:var(--muted2);flex:none}
.b-when{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6;max-width:820px}
.b-body{padding:0 18px 18px}

/* 하위 유형 */
.stypes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.stype{border:1.5px solid var(--line);border-radius:13px;background:var(--panel);padding:12px 14px;font-size:13px;font-weight:650;cursor:pointer;text-align:left}
.stype:hover{border-color:#cfcfca;background:#fff}
.stype.on{background:var(--black);border-color:var(--black);color:#fff}
.stype small{display:block;font-weight:400;font-size:10.5px;color:var(--muted2);margin-top:3px}
.stype.on small{color:rgba(255,255,255,.6)}

/* ── 단계 칩 ── */
.owner-bar{display:flex;gap:22px;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:11px 15px;margin:14px 0}
.ob{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}
.ob i{font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--muted2);font-style:normal;flex:none}
.ob b{color:var(--text);font-weight:650}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.step{border:1.5px solid var(--line);border-radius:15px;background:var(--card);padding:15px 16px;display:flex;flex-direction:column}
.step.gate{border-color:var(--black)}
.s-no{font:700 10px var(--mono);color:var(--muted2);letter-spacing:.1em;margin-bottom:8px}
.s-ttl{font-size:14.5px;font-weight:730;letter-spacing:-.03em;margin-bottom:11px;line-height:1.4}
.step dl{margin:0;font-size:11.5px;line-height:1.6}
.step dt{color:var(--muted2);font-size:10px;font-weight:600;letter-spacing:.06em;margin-top:8px}
.step dt:first-child{margin-top:0}
.step dd{margin:2px 0 0}
.calls{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft)}
.calls .ck{font:600 10px var(--mono);letter-spacing:.06em;color:var(--muted2);margin-bottom:7px}
.ag{display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--mono);padding:4px 9px;border-radius:8px;background:var(--black);color:#fff;margin:0 4px 5px 0;cursor:pointer;border:1.5px solid var(--black)}
.ag.sk{background:#fff;color:var(--black)}
.ag:hover{opacity:.82}
.ag .cp{font-size:9px;opacity:.7;border-left:1px solid rgba(255,255,255,.28);padding-left:6px}
.ag.sk .cp{border-left-color:rgba(17,17,17,.2)}
.agw{display:block;font-size:11px;color:var(--muted);line-height:1.5;margin-top:2px}
.s-next{margin-top:auto;padding-top:11px;font-size:11.5px;color:var(--muted)}
.step.gate .s-next{color:var(--text);font-weight:600}

/* ── 위치·되돌아가기 ── */
.crumb{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px;font-size:12.5px;color:var(--muted)}
.crumb .back{border:1px solid var(--line);background:var(--card);border-radius:10px;height:30px;padding:0 11px;font-size:12px;font-weight:650;cursor:pointer}
.crumb .back:hover{border-color:#cfcfca}
.crumb b{color:var(--text);font-weight:650}
.loop{margin-top:14px;text-align:center;font:500 11px var(--mono);color:var(--muted2)}
.gate-tip{font-size:11.5px;color:var(--muted);margin-top:12px}

.always-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.always-item{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px 16px}
.always-item .aw{font-size:13px;font-weight:700;letter-spacing:-.02em;display:block;margin-bottom:9px}
.always-item .agw{margin-bottom:9px}
.always-item .agw:last-child{margin-bottom:0}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(12px);background:var(--black);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:90}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){
  .spine,.spine.end3{grid-template-columns:1fr;gap:8px}
  .spine .snode:not(:last-child){margin-right:0}
  .spine .snode:not(:last-child)::after{right:auto;left:50%;top:auto;bottom:-17px;transform:translateX(-50%) rotate(90deg)}
  .steps{grid-template-columns:1fr}
  .always-grid{grid-template-columns:1fr}
}
</style>
</head>
<body data-page="workflows">
<div class="app">
  <main class="main">

    <div class="page-head">
      <div class="page-eyebrow">MAX OS · WORKFLOW</div>
      <h1 class="page-title">일의 흐름 한 장</h1>
      <p class="page-desc">무엇을 만들지만 고르시면 됩니다. 순서와 도와줄 것이 함께 열립니다.</p>
    </div>

    <div class="crumb" id="crumb"></div>

    <section class="panel" style="padding:22px">
      <div class="spine-label">시작 — 어떤 갈래를 펼쳐도 자리를 지킵니다</div>
      <div class="spine" id="entry"></div>

      <div class="branches" id="branches"></div>

      <div class="spine-label">마무리 — 여기서 끝나지 않고 첫 칸으로 돌아갑니다</div>
      <div class="spine end3" id="end"></div>
      <div class="loop">↺ 여기서 꺼낸 걸 다음 일에 쓰면 다시 맨 앞으로 돌아옵니다</div>
    </section>

    <article class="panel" style="margin-top:22px">
      <div class="panel-head"><h2 style="font-size:16px">단계와 상관없이 늘 거치는 것</h2>
        <span style="font-size:12px;color:var(--muted2)">어떤 갈래든 이 두 가지는 지나갑니다</span></div>
      <div class="always-grid" id="always"></div>
    </article>

    <p class="mono" style="color:var(--muted2);font-size:10.5px;margin-top:20px">
      원본 지도: Figma 전체 AX Product Flow ·
      <a href="https://www.figma.com/design/NmXRGXueVLvby4xEp9sgP9/-MAX--AI-%EC%9B%8C%ED%81%AC%ED%94%8C%EB%A1%9C%EC%9A%B0?node-id=272-2" target="_blank" rel="noopener" style="color:#2454C7;text-decoration:none">Figma에서 열기 ↗</a>
      · Owner 미지정 · v1 · 2026-08-20
    </p>

  </main>
</div>
<div class="toast" id="toast"></div>

<script src="assets/shell.js"></script>
<script src="assets/flows.js"></script>
<script>
(function(){
  'use strict';
  var $=function(s){return document.querySelector(s)}, F=window.FLOWS;
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  /* 상태: #갈래 또는 #갈래/하위유형 */
  function parse(){
    var p=(location.hash||'').slice(1).split('/');
    var b=F.branches.filter(function(x){return x.id===p[0]})[0];
    if(!b) return {};
    var s=b.subtypes.filter(function(x){return x.id===p[1]})[0];
    if(!s && b.subtypes.length===1) s=b.subtypes[0];   /* 하위 하나뿐이면 바로 열기 */
    return {b:b,s:s};
  }

  function agChips(list){
    return list.map(function(c){
      return '<button class="ag'+(c.sk?' sk':'')+'" data-copy="'+esc(c.n)+'" title="눌러서 이름 복사">'+esc(c.n)+'<span class="cp">⧉ 복사</span></button>'+
             '<span class="agw">'+esc(c.w)+'</span>';
    }).join('');
  }

  function stepsHtml(st){
    return '<div class="owner-bar">'+
      '<span class="ob"><i>담당</i><span><b>맡은 사람 한 명</b>이 1~3단계를 끝까지 이어서 합니다</span></span>'+
      '<span class="ob"><i>디렉터</i><span>★ 한 곳에서 <b>방향만</b> 봅니다</span></span></div>'+
      '<div class="steps">'+ st.steps.map(function(s,i){
        return '<div class="step'+(s.gate?' gate':'')+'">'+
          '<div class="s-no">STEP 0'+(i+1)+'</div>'+
          '<div class="s-ttl">'+esc(s.t)+'</div>'+
          '<dl><dt>필요한 것</dt><dd>'+esc(s.get)+'</dd><dt>나오는 것</dt><dd>'+esc(s.make)+'</dd></dl>'+
          '<div class="calls"><div class="ck">도와주는 것 · 눌러서 이름 복사</div>'+agChips(s.call)+'</div>'+
          '<div class="s-next">'+(s.gate?'★ <b>디렉터가 방향을 봅니다</b> — 계속 갈지만 정해요':'다음 → '+esc(s.next))+'</div>'+
        '</div>';
      }).join('') +'</div>'+
      '<p class="gate-tip">모든 흐름은 마지막에 <b>사람이 확인해요</b>를 거칩니다. 내보내기 직전 점검은 아래 「늘 거치는 것」에 있습니다.</p>';
  }

  function render(){
    var st=parse();

    $('#entry').innerHTML=F.entry.map(function(n){
      return '<div class="snode"><b>'+esc(n.label)+'</b><span class="n">'+esc(n.note)+'</span></div>';
    }).join('');
    $('#end').innerHTML=F.end.map(function(n){
      return '<div class="snode"><b>'+esc(n.label)+' <span class="en">('+esc(n.en)+')</span></b><span class="n">'+esc(n.note)+'</span></div>';
    }).join('');

    $('#branches').innerHTML=F.branches.map(function(b){
      var open=st.b&&st.b.id===b.id, dim=st.b&&!open;
      var cnt=b.subtypes.length>1? '하위 '+b.subtypes.length+'종' : '3단계';
      var h='<div class="branch'+(open?' open':'')+(dim?' dim':'')+'">'+
        '<button class="b-head" data-b="'+b.id+'" aria-expanded="'+(open?'true':'false')+'">'+
        '<div class="b-top"><b>'+esc(b.label)+'</b><span class="cnt">'+cnt+'</span>'+
        '<span class="pm" aria-hidden="true">'+(open?'−':'＋')+'</span></div>'+
        '<div class="b-when">'+esc(b.when)+'</div>'+
        (open?'':'<div class="b-hint">＋ 를 누르면 순서가 열립니다</div>')+'</button>';
      if(open){
        h+='<div class="b-body">';
        if(b.subtypes.length>1){
          h+='<div class="b-hint" style="margin:0 0 9px">무엇을 만드는지 하나 고르시면 순서가 나옵니다</div><div class="stypes">'+b.subtypes.map(function(s){
            return '<button class="stype'+(st.s&&st.s.id===s.id?' on':'')+'" data-b="'+b.id+'" data-s="'+s.id+'">'+esc(s.label)+
                   (s.formal?'<small>'+esc(s.formal)+'</small>':'')+'</button>';
          }).join('')+'</div>';
        }
        if(st.s) h+=stepsHtml(st.s);
        h+='</div>';
      }
      return h+'</div>';
    }).join('');

    /* 위치 표시 */
    var c='';
    if(st.b){
      c='<button class="back" id="back">← 지도 전체로</button><span>홈 › <b>'+esc(st.b.label)+'</b>';
      if(st.s && st.b.subtypes.length>1) c+=' › <b>'+esc(st.s.label)+'</b>';
      c+='</span>';
    } else {
      c='<span>아래 <b>4갈래</b> 중 하나를 누르시면 순서가 열립니다.</span>';
    }
    $('#crumb').innerHTML=c;

    $('#always').innerHTML=F.always.map(function(a){
      return '<div class="always-item"><span class="aw">'+esc(a.when)+'</span>'+agChips(a.call)+'</div>';
    }).join('');
  }

  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1500)}

  document.addEventListener('click',function(e){
    var ag=e.target.closest('.ag');
    if(ag){
      var n=ag.getAttribute('data-copy');
      if(navigator.clipboard) navigator.clipboard.writeText(n).then(function(){toast(n+' 복사했어요')},function(){toast(n)});
      else toast(n);
      return;
    }
    if(e.target.closest('#back')){ location.hash=''; return; }
    var sb=e.target.closest('.stype');
    if(sb){ location.hash=sb.getAttribute('data-b')+'/'+sb.getAttribute('data-s'); return; }
    var bh=e.target.closest('.b-head');
    if(bh){
      var id=bh.getAttribute('data-b'), cur=parse();
      location.hash = (cur.b&&cur.b.id===id) ? '' : id;
    }
  });
  window.addEventListener('hashchange',function(){render();window.scrollTo({top:0,behavior:'smooth'})});
  render();
})();
</script>
</body>
</html>
